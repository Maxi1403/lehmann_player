<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hörbuch</title>
<style>
  body { margin: 0; background: #ad0000; }               /* Hintergrundfarbe */
  main { width: min(100%, 1800px); margin: 0 auto; padding: 4vh 0;
         display: flex; flex-direction: column; align-items: center; gap: 2vh; }
  main img { display: block; max-width: 100%; }

  #player { position: relative; width: 90%; container-type: inline-size; }
  #player img { width: 80%; }

  /* Tasten und Zahl: Mitte in % vom Player-Bild */
  #player button { position: absolute; transform: translate(-50%, -50%); aspect-ratio: 1;
                   padding: 0; border: 0; border-radius: 50%; background: none; cursor: pointer; }
  /* zum Einstellen kurz einkommentieren:  #player button { background: rgba(255,0,0,.3); } */
  #zurueck { left: 25%; top: 68%; width: 20%; }
  #play    { left: 45%; top: 68%; width: 20%; }
  #weiter  { left: 65%; top: 68%; width: 20%; }

  #zahl { position: absolute; left: 60%; top: 30%; transform: translate(-50%, -50%);
          font: 700 8cqw "Courier New", monospace; color: #1a1a1a; }   /* 8cqw = Schriftgröße */
</style>
</head>
<body>
<main>
  <img src="svenregenerSchrift.png" alt="" style="width: 50%">
  <img src="lehmannschrift.png" alt="" style="width: 80%">
  <img src="roman.png" alt="" style="width: 20%">

  <div id="player">
    <img src="player.png" alt="">
    <button id="zurueck" aria-label="Zurück"><img src="zurück.png" alt=""></button>
    <button id="play" aria-label="Abspielen / Pause"><img src="play.png" alt=""></button>
    <button id="weiter" aria-label="Weiter"><img src="weiter.png" alt=""></button>
    <span id="zahl">7</span>
  </div>

  <img src="kronkorken.png" alt="" style="width: 100%">
</main>
<audio id="audio"></audio>

<script>
  // Kapitel, die schon aufgenommen sind (Dateien: audio/kapitel-07.mp3, ...)
  const KAPITEL = [8, 9, 10, 11, 12];

  const $ = id => document.getElementById(id);
  const audio = $("audio");
  let i = 0;

  function laden(neu, abspielen) {
    i = Math.max(0, Math.min(KAPITEL.length - 1, neu));
    $("zahl").textContent = KAPITEL[i];
    audio.src = `audio/kapitel-${String(KAPITEL[i]).padStart(2, "0")}.mp3`;
    if (abspielen) audio.play();
  }

  $("play").onclick    = () => audio.paused ? audio.play() : audio.pause();
  $("zurueck").onclick = () => laden(i - 1, !audio.paused);
  $("weiter").onclick  = () => laden(i + 1, !audio.paused);
  audio.onended        = () => { if (i < KAPITEL.length - 1) laden(i + 1, true); };

  laden(0, false);
</script>
</body>
</html>
